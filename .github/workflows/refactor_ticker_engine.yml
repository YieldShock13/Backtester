name: Refactor ticker engine
on:
  push:
    paths:
      - 'scripts/refactor_ticker_engine.py'
jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refactor_ticker_engine.py
      - run: python -m py_compile app.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=['Exact Yahoo Finance tickers','auto_adjust=False','Return Attribution by Ticker — Capital Gain vs Income','Income % of Total','No automatic FX overlay','STXGVI.JO']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing required elements')
          forbidden=['Macro Tracker — FX Attribution','P^{ZAR}_{a,t}']
          hit=[x for x in forbidden if x in s]
          if hit: raise SystemExit('Legacy FX elements remain')
          print('VALIDATION PASS')
          PY
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add app.py
          git diff --cached --check
          git commit -m 'Use exact source tickers and return-component attribution'
          git push
