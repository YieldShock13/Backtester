name: Refactor ticker engine
on:
  push:
    paths:
      - 'scripts/refactor_ticker_engine.py'
      - '.github/workflows/refactor_ticker_engine.yml'
jobs:
  refactor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/refactor_ticker_engine.py
      - run: python -m py_compile app.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=['Exact Yahoo Finance tickers','auto_adjust=False','Return Attribution by Ticker — Capital Gain vs Income','Income % of Total','No automatic FX overlay','STXGVI.JO']
          if any(x not in s for x in required): raise SystemExit('Required refactor element missing')
          if 'Macro Tracker — FX Attribution' in s or 'P^{ZAR}_{a,t}' in s: raise SystemExit('Legacy FX overlay remains')
          print('VALIDATION PASS')
          PY
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add app.py
          git diff --cached --check
          git commit -m 'Use exact source tickers and return-component attribution'
          git push
