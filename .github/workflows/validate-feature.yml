name: Validate configurable backtester

on:
  push:
    branches:
      - feature/config-audit-latex-fx
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m py_compile app.py app_v2.py feature_config.py daily_window.py test_feature_config.py test_app_v2_logic.py test_daily_window.py
      - name: Run deterministic validation tests
        run: pytest -q test_app_v2_logic.py test_daily_window.py && python test_feature_config.py
