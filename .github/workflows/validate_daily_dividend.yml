name: validate-daily-dividend-engine
on:
  push:
    branches: [validate-daily-dividend-engine]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy yfinance
      - run: python validate_daily_dividend.py
