name: Isolate Orcas Capital Strategies header
on:
  push:
    branches: [main]
    paths:
      - 'scripts/isolate_orcas_header.py'
      - 'scripts/expand_history_walkforward.py'
      - '.github/workflows/add_orcas_theme.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build corrected app
        run: python scripts/isolate_orcas_header.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=[
              "ORCA'S","CAPITAL STRATEGIES","auto_adjust=False","Show LaTeX","period='max'",
              "Walk-Forward Validator — 52-Week Estimation Window","GARCH(1,1)",
              "common_inception=max(first_valid)","excluded_incomplete_weeks","Complete-case weekly alignment",
              "Correlation method", "['Pearson','Spearman']", "corr_method.lower()",
              "min_value=-500.0", "Net exposure must equal 100%",
              "Use leverage", "Leverage (x)", "Annual financing cost (%)",
              "apply_leverage", "financing_cost", "LEVERAGE", "FINANCING_COST",
              "Not financial advice", "subject to revision"
          ]
          for x in required:
              assert x in s,x
          assert 'dropped_asset_weeks' not in s
          assert 'START="2012-02-01"' not in s
          assert s.count('st.set_page_config(')==1
          assert "min_value=0.0,max_value=100.0" not in s
          print('PASS: shorts, leverage, financing, correlation selector and disclaimer validated')
          PY
      - name: Commit validated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && { echo 'No app.py changes produced'; exit 1; }
          git commit -m "Add shorts leverage financing Spearman and disclaimer"
          git pull --rebase origin main
          git push origin HEAD:main
