name: Isolate Orcas Capital Strategies header
on:
  push:
    branches: [main]
    paths:
      - 'scripts/isolate_orcas_header.py'
      - 'scripts/expand_history_walkforward.py'
      - 'scripts/final_short_leverage_spearman_patch.py'
      - 'scripts/rebalancing_frequency_patch.py'
      - '.github/workflows/add_orcas_theme.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build corrected app
        run: python scripts/isolate_orcas_header.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=[
              "ORCA'S","CAPITAL STRATEGIES","auto_adjust=False","Show LaTeX","period='max'",
              "Walk-Forward Validator — 52-Week Estimation Window","GARCH(1,1)",
              "common_inception=max(first_valid)","excluded_incomplete_weeks","Complete-case weekly alignment",
              "Benchmark (optional)","USE_BENCHMARK=st.toggle('Use benchmark'",
              "benchmark_overlap_start=max(prices.index.min(),bench_valid.index.min())",
              "Only those benchmark-dependent observations are dropped","Portfolio history begins",
              "Negative weight = short position","Portfolio leverage (x)",
              "Annual leverage / financing cost (%)","Correlation measure",
              "['Pearson','Spearman']","corr(method=corr_method.lower())",
              "Average Inter-Asset {corr_method} Correlation",
              "levered_r=LEVERAGE*base_r-(LEVERAGE-1.0)*weekly_financing",
              "Not financial advice. For research, analytical, educational and informational purposes only.",
              "with st.expander('Full Disclaimer'","Nothing contained in or produced by this tool constitutes",
              "Backtested, simulated and hypothetical results have inherent limitations",
              "Leverage and short positions can materially magnify","Use of this tool does not create an adviser-client",
              "st.selectbox('Backtest mode',['Buy & Hold','Rebalanced']",
              "st.selectbox('Rebalancing frequency',['Annual','Semi-Annual','Quarterly','Monthly','Weekly']",
              "freq=='Weekly'","freq=='Monthly'","freq=='Quarterly'","freq=='Semi-Annual'","freq=='Annual'",
              "mode_label=f'{rebalance_frequency} Rebalanced'","line_chart({mode_label:p}","line_chart({mode_label:growth}"
          ]
          for x in required: assert x in s,x
          assert 'dropped_asset_weeks' not in s
          assert 'START="2012-02-01"' not in s
          assert s.count('st.set_page_config(')==1
          assert "st.number_input(f'{a0} (%)',0.0,100.0" not in s
          assert "aligned_index=prices.index.intersection" not in s
          assert "benchmark_missing_weeks=int(bp_all.reindex(prices.index).isna().sum())" not in s
          print('PASS: complete app including rebalance frequency validated')
          PY
      - name: Commit validated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && { echo 'No app.py changes produced'; exit 1; }
          git commit -m "Deploy configurable rebalance frequency"
          git pull --rebase origin main
          git push origin HEAD:main
