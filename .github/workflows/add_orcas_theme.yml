name: Isolate Orcas Capital Strategies header
on:
  push:
    branches: [main]
    paths:
      - 'scripts/isolate_orcas_header.py'
      - '.github/workflows/add_orcas_theme.yml'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove global theme leakage
        run: python scripts/isolate_orcas_header.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          for x in ["ORCA'S","CAPITAL STRATEGIES","orcaFloat","waveDash","auto_adjust=False","Pearson Correlation Matrix","Historical Scenario Analysis","Show LaTeX","Return Attribution by Instrument"]:
              assert x in s,x
          for x in ['.stApp{','[data-testid="stHeader"]{','[data-testid="stToolbar"]{','[data-testid="stMetric"]{','.stButton>button{']:
              assert x not in s,x
          assert s.count('st.set_page_config(')==1
          print('PASS: header branding retained; global analytics styling removed')
          PY
      - name: Commit validated app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 1
          git commit -m "Keep Orca branding in header only"
          git push origin HEAD:main
