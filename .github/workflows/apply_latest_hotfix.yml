name: Apply latest scoped hotfix
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_fx_beta_hedging.py'
      - 'scripts/relabel_macro_regimes.py'
      - '.github/workflows/apply_latest_hotfix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply macro regime label clarification
        run: python scripts/relabel_macro_regimes.py
      - name: Compile production app
        run: python -m py_compile app.py
      - name: Regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=['JSE drawdown regime (≥10% below prior peak)','NOT a -10% one-period shock','Avg JSE Period Return During Regime','FX hedged','Pearson Correlation Matrix','Return Attribution by Instrument','Macro Risk & Conditional Performance','Show LaTeX','auto_adjust=False','actions=True']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+repr(missing))
          print('LABEL + REGRESSION CHECKS: PASS')
          PY
      - name: Commit validated app only
        run: |
          if git diff --quiet -- app.py; then echo 'No app changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Clarify macro risk regime labels'
          git push origin HEAD:main
