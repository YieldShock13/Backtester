name: Expand quantitative LaTeX workings
on:
  push:
    branches: [main]
    paths:
      - 'scripts/expand_latex_quant.py'
      - '.github/workflows/expand_latex_quant.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/expand_latex_quant.py
      - run: python -m py_compile app.py
      - name: Quant coverage and regression assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=['Show LaTeX','Complete Quantitative Workings','Historical VaR','Expected Shortfall','Pearson covariance','Rolling beta','Conditional beta','Return attribution by instrument','Downside deviation','Calmar','CAPM alpha','Annual rebalancing','Adjusted Close is not used']
          for x in required: assert x in s,x
          assert "title='Pearson Correlation Matrix'" in s
          assert "auto_adjust=False" in s
          assert "Return Attribution by Instrument" in s
          print('PASS')
          PY
      - name: Commit validated app only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git diff --cached --quiet && exit 1
          git commit -m 'Expand Show LaTeX to complete quantitative workings'
          git push origin HEAD:main
