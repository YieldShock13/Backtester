name: Fix STXGVI units safely
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fix_stxgvi_units.yml']
permissions:
  contents: write
jobs:
  patch-validate-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped STXGVI patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.py')
          s=p.read_text()
          marker="@st.cache_data(ttl=3600,show_spinner=False)\ndef load_ticker_components(tickers):"
          helper='''def _normalise_stxgvi_close(close):\n s=close.astype(float).copy().dropna(); ratios=s/s.shift(1)\n breaks=ratios[(ratios>50)&(ratios<150)].index.tolist()+ratios[(ratios>.005)&(ratios<.02)].index.tolist()\n for dt in sorted(set(breaks)):\n  i=s.index.get_loc(dt); ratio=s.iloc[i]/s.iloc[i-1]\n  if ratio>50: s.iloc[i:]=s.iloc[i:]/100.0\n  elif ratio<.02: s.iloc[i:]=s.iloc[i:]*100.0\n if float(s.tail(min(60,len(s))).median())>1000: s=s/100.0\n if not (20<float(s.iloc[-1])<200): raise RuntimeError(f'STXGVI normalised close implausible: {s.iloc[-1]:.2f} ZAR')\n return s\n\n'''
          if helper not in s:
              if marker not in s: raise SystemExit('loader marker missing')
              s=s.replace(marker,helper+marker,1)
          old="  close=pd.to_numeric(h['Close'],errors='coerce').dropna()\n  div=pd.to_numeric(h.get('Dividends',0.0),errors='coerce').fillna(0.0).reindex(close.index,fill_value=0.0)"
          new="  close=pd.to_numeric(h['Close'],errors='coerce').dropna()\n  div=pd.to_numeric(h.get('Dividends',0.0),errors='coerce').fillna(0.0).reindex(close.index,fill_value=0.0)\n  if ticker.upper()=='STXGVI.JO':\n   close=_normalise_stxgvi_close(close)\n   div=div.reindex(close.index,fill_value=0.0)/100.0\n   check_date=pd.Timestamp('2023-04-25')\n   if check_date in div.index and not np.isclose(float(div.loc[check_date]),1.9145,rtol=0,atol=.0001): raise RuntimeError(f'STXGVI distribution conversion failed: {div.loc[check_date]} ZAR')\n   for dt,dv in div[div!=0].items():\n    px=close.asof(dt)\n    if np.isfinite(px) and (dv<=0 or dv/px>.20): raise RuntimeError(f'STXGVI distribution sanity check failed on {dt.date()}: dividend_ZAR={dv}, close_ZAR={px}')"
          if old not in s: raise SystemExit('target loader block missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Compile
        run: python -m py_compile app.py
      - name: Regression checks
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=['_normalise_stxgvi_close','div=div.reindex(close.index,fill_value=0.0)/100.0','2023-04-25','1.9145','Pearson Correlation Matrix','Search asset','Return Attribution by Ticker']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing invariants: '+repr(missing))
          if 'FX Attribution' in s: raise SystemExit('FX attribution regression')
          print('REGRESSION CHECKS: PASS')
          PY
      - name: Commit validated production patch
        run: |
          if git diff --quiet -- app.py; then echo 'No app change'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix STXGVI price and distribution unit normalisation'
          git push
