name: Fix selected asset sync
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_selected_asset_sync.py'
      - '.github/workflows/fix_selected_asset_sync.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch selected asset state
        run: python scripts/fix_selected_asset_sync.py
      - name: Compile
        run: python -m py_compile app.py
      - name: Validate exact behavior and regressions
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text()
          required=["st.session_state.selected_assets_widget=current","st.session_state.asset_search_pick=None","st.pills('Search results'","Pearson Correlation Matrix","Complete Calculation Workings","auto_adjust=False"]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('MISSING '+repr(missing))
          print('SELECTED-ASSET SYNC + REGRESSION ASSERTIONS PASS')
          PY
      - name: Commit app fix
        run: |
          if git diff --quiet -- app.py; then echo 'No app diff produced' && exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fix search selection syncing into selected assets'
          git push origin HEAD:main
